name: X sources probe (temporary)
on:
  push:
    branches: [x-nitter]
permissions:
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - name: Live test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=/tmp/probe.md
          echo "# בדיקה חיה: FxTwitter + Nitter — $(date -u)" > $out
          echo '```' >> $out
          for i in 1 2 3; do
            X_LIVE=ariel__danino,meiretingr go test -count=1 -run 'TestXLive$' -v . 2>&1 | grep -v "^=== RUN" | cut -c1-200 >> $out
            echo "----" >> $out
            sleep 20
          done
          echo "== רק Nitter (FxTwitter כבוי):" >> $out
          X_LIVE=ariel__danino,meiretingr X_API=http://127.0.0.1:9 go test -count=1 -run 'TestXLive$' -v . 2>&1 | grep -v "^=== RUN" | cut -c1-200 | head -40 >> $out
          echo '```' >> $out
          gh issue comment 3 -R "$GITHUB_REPOSITORY" -F $out
