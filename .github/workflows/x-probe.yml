name: X probe (temporary)
on: workflow_dispatch
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: bash {0}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          {
          for H in kann_news yinonmagal ariel__danino; do
            curl -s -A "$UA" --max-time 25 "https://api.fxtwitter.com/2/profile/$H/statuses" > b.json
            echo "## $H"
            echo '```json'
            jq -c '[.results[] | select(.media != null or .quote != null or .replying_to != null)] | .[0:3] | map(del(.author.banner_url,.author.avatar_url, .author.description, .raw_text.facets))' b.json | head -c 9000
            echo; echo '```'
            sleep 3
          done
          } > out.txt 2>&1
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body-file <(head -c 60000 out.txt)
