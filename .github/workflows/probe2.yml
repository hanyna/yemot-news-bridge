name: Patriots probe (temporary)
on:
  push:
    branches: [probe2]
permissions:
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: |
          set +e
          out=/tmp/probe.md
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          K=$(printf %s "$YEMOT_API_KEY" | tr -d '[:space:]')
          echo "# הפטריוטים — יוטיוב וקול — $(date -u)" > $out
          echo '```' >> $out
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1
          curl -sL -m 30 -A "$UA" -H "Accept-Language: he" -b "CONSENT=YES+1" -o /tmp/pl.html "https://www.youtube.com/playlist?list=PL8E54R76rowCcCOn_HQf36o1RF3_oD3z4"
          python3 - >> $out 2>&1 <<'PY'
          import re,datetime
          s=open('/tmp/pl.html',encoding='utf-8').read()
          for t in re.findall(r'"lockupMetadataViewModel":\{"title":\{"content":"((?:[^"\\]|\\.)*)"',s)[:14]:
              m=re.search(r'(\d{1,2})\.(\d{1,2})\.(\d{4})',t)
              print(datetime.date(int(m[3]),int(m[2]),int(m[1])).strftime('%a') if m else '   ', t)
          PY
          for f in 10000 10002 10004; do
            curl -s -m 120 -H "Authorization: $K" --data-urlencode "path=ivr2:/3/3/$f.wav" -o /tmp/$f.wav https://www.call2all.co.il/ym/api/DownloadFile
            echo "-- $f: $(wc -c </tmp/$f.wav) bytes, $(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/$f.wav)s" >> $out
            ffmpeg -hide_banner -nostdin -ss 600 -t 600 -i /tmp/$f.wav -af volumedetect -f null - 2>&1 | grep -o "mean_volume.*\|max_volume.*" >> $out
          done
          echo '```' >> $out
          sed -i "s/$K/***/g" $out
          gh issue comment 3 -R "$GITHUB_REPOSITORY" -F $out
