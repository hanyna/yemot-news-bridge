name: Patriots probe (temporary)
on:
  push:
    branches: [probe2]
permissions:
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: |
          set +e
          out=/tmp/probe.md
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          K=$(printf %s "$YEMOT_API_KEY" | tr -d '[:space:]')
          echo "# מבנה עמוד היוטיוב — $(date -u)" > $out
          echo '```' >> $out
          curl -sL -m 30 -A "$UA" -H "Accept-Language: he" -b "CONSENT=YES+1" -o /tmp/pl.html "https://www.youtube.com/playlist?list=PL8E54R76rowCcCOn_HQf36o1RF3_oD3z4"
          python3 - >> $out 2>&1 <<'PY'
          s=open('/tmp/pl.html',encoding='utf-8').read()
          parts=s.split('"lockupViewModel":{')
          print('lockup blocks:', len(parts)-1)
          import re
          ok=0
          for seg in parts[1:]:
              cid=re.search(r'"contentId":"([A-Za-z0-9_-]{11})"',seg)
              tit=re.search(r'"lockupMetadataViewModel":\{"title":\{"content":"((?:[^"\\]|\\.)*)"',seg)
              if cid and tit and 'התוכנית המלאה' in tit.group(1):
                  ok+=1
                  if ok<=4: print(cid.group(1), tit.group(1))
          print('full-episode lockups matched:', ok)
          PY
          echo '```' >> $out
          sed -i "s/$K/***/g" $out
          gh issue comment 3 -R "$GITHUB_REPOSITORY" -F $out
