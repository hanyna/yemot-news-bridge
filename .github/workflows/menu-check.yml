name: Menu check (temporary)
on: workflow_dispatch
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - name: Check menu
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MENU_DIAG: "1"
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: |
          set +e
          { echo "# בדיקת תפריט — $(date -u)"; echo '```'
          go test -count=1 -run TestMenuDiag -v . 2>&1 | grep -v "^=== RUN\|^--- \|^PASS\|^ok "
          for R in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/bridge.yml/runs?per_page=3" --jq '.workflow_runs[].id'); do
            J=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$R/jobs" --jq '.jobs[0].id')
            U=$(curl -s -o /dev/null -w '%{redirect_url}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$J/logs")
            curl -s "$U" -o log.txt
            echo "== הפעלה $R: $(wc -l < log.txt) שורות"
            grep -E 'תפריט בחירת כתב|2/4|ayeletlash|כותרת|לא נוגע|קול מוכן: f' log.txt | grep -v 'שלוחה 2/4 / ' | cut -c1-260 | tail -25
          done
          echo '```'; } > report.md
          num=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=50" --jq '.[] | select(.title=="בדיקת קול (זמני)") | .number' | head -1)
          gh api "repos/$GITHUB_REPOSITORY/issues/$num/comments" -F body=@report.md --jq .html_url
