name: Podcast probe (temporary)
on:
  workflow_dispatch: {}
  push:
    paths: [".github/workflows/podcast-probe.yml"]
permissions:
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: |
          set +e
          out=/tmp/probe.md
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "# מקור מוכן להפטריוטים — $(date -u)" > $out
          echo '```' >> $out
          K=x
          PL=PL8E54R76rowCcCOn_HQf36o1RF3_oD3z4
          curl -sL -m 30 -A "$UA" -H "Accept-Language: he" -b "CONSENT=YES+1" -o /tmp/pl.html "https://www.youtube.com/playlist?list=$PL"
          VID=$(python3 -c "
          import re
          s=open('/tmp/pl.html',encoding='utf-8').read()
          for m in re.finditer(r'\"contentId\":\"([^\"]{11})\"',s):
              seg=s[m.end():m.end()+6000]
              if 'התוכנית המלאה' in seg.split('contentId')[0]:
                  print(m.group(1)); break
          ")
          echo "video $VID" >> $out
          pip install -q -U yt-dlp >/dev/null 2>&1
          timeout 120 yt-dlp -F "https://www.youtube.com/watch?v=$VID" 2>&1 | tail -15 >> $out
          echo "-- iTunes" >> $out
          curl -s -m 30 -o /tmp/it.json "https://itunes.apple.com/search?term=%D7%94%D7%A4%D7%98%D7%A8%D7%99%D7%95%D7%98%D7%99%D7%9D&entity=podcast&country=il"
          python3 -c "import json;[print(r.get('collectionName'),'|',r.get('artistName'),'|',r.get('releaseDate'),'|',r.get('feedUrl')) for r in json.load(open('/tmp/it.json'))['results'][:8]]" >> $out 2>&1
          echo "-- c14.co.il" >> $out
          for u in "https://www.c14.co.il/" "https://www.c14.co.il/vod" "https://www.c14.co.il/patriots"; do
            r=$(curl -sL -m 30 -A "$UA" -o /tmp/c.html -w "%{http_code} %{url_effective}" "$u"); echo "$u → $r $(wc -c </tmp/c.html)B" >> $out
            grep -o 'href="[^"]*\(patriot\|פטריוט\|vod\|episode\|program\)[^"]*"' /tmp/c.html | sort -u | head -15 >> $out
            grep -o '[a-z0-9.-]*\(redge\|kaltura\|jwplayer\|brightcove\|vimeo\)[a-z0-9./-]*' /tmp/c.html | sort -u | head -5 >> $out
          done
          echo '```' >> $out
          sed -i "s/$K/***/g" $out
          gh issue comment 3 -R "$GITHUB_REPOSITORY" -F $out
# Fri Oct  9 09:17:37 IDT 2026
