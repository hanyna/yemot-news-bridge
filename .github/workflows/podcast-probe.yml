name: Podcast probe (temporary)
on:
  workflow_dispatch: {}
  push:
    paths: [".github/workflows/podcast-probe.yml"]
permissions:
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: |
          set +e
          out=/tmp/probe.md
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "# בדיקת פודקאסטים 3 — $(date -u)" > $out
          echo '```' >> $out
          PL=PL8E54R76rowCcCOn_HQf36o1RF3_oD3z4
          curl -sL -m 30 -A "$UA" -H "Accept-Language: he" -b "CONSENT=YES+1" -o /tmp/pl.html "https://www.youtube.com/playlist?list=$PL"
          python3 - >> $out 2>&1 <<'PY'
          import re,json
          s=open('/tmp/pl.html',encoding='utf-8').read()
          print('playlistVideoRenderer', s.count('playlistVideoRenderer'), 'lockupViewModel', s.count('lockupViewModel'), 'continuation', s.count('continuationCommand'))
          i=s.find('התוכנית המלאה'); print('first full at', i)
          print(s[max(0,i-700):i+300].replace('\n',' '))
          for m in re.finditer(r'"videoId":"([^"]{11})"',s):
              pass
          ids=[]
          for m in re.finditer(r'"playlistVideoRenderer":\{"videoId":"([^"]{11})".*?"title":\{"runs":\[\{"text":"((?:[^"\\]|\\.)*)"',s):
              ids.append((m.group(1),m.group(2)))
          print('parsed', len(ids))
          for x in ids[:6]+[('...','')]+ids[-6:]: print(x)
          PY
          curl -s -m 30 -o /tmp/e.json "https://api.spreaker.com/v2/shows/4489948/episodes?sorting=newest&limit=3"
          python3 -c "import json;[print(e['published_at'],e['title'],e['episode_id']) for e in json.load(open('/tmp/e.json'))['response']['items']]" >> $out 2>&1
          echo '```' >> $out
          sed -i "s/$YEMOT_API_KEY/***/g" $out
          gh issue comment 3 -R "$GITHUB_REPOSITORY" -F $out
