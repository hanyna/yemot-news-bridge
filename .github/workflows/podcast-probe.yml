name: Podcast probe (temporary)
on:
  workflow_dispatch: {}
  push:
    paths: [".github/workflows/podcast-probe.yml"]
permissions:
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: |
          set +e
          out=/tmp/probe.md
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "# איכות ההקלטה מערוץ 14 — $(date -u)" > $out
          echo '```' >> $out
          K=x
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1
          B=https://r.il.cdn-redge.media/livehls/oil/ch14/live/ch14/live.livx
          u=$(date -u -d "2026-10-08T18:40:00Z" +%s)
          rm -f /tmp/all.ts
          for i in $(seq 0 14); do ms=$(( ((u-978307200)/4*4 + i*4)*1000 )); curl -sL -m 20 -A "$UA" -o /tmp/f$i.ts "$B/fragment.ts?audioId=1&startTime=$ms"; cat /tmp/f$i.ts >> /tmp/all.ts; done
          for i in 0 1 2; do ffprobe -v error -select_streams a:0 -show_entries stream=start_time,duration -of csv=p=0 /tmp/f$i.ts | tr '\n' ' ' >> $out; echo " (f$i)" >> $out; done
          echo "-- gaps (plain concat), seconds:" >> $out
          ffmpeg -hide_banner -nostdin -i /tmp/all.ts -vn -af silencedetect=n=-50dB:d=0.02 -f null - 2>&1 | grep -o "silence_start: [0-9.]*\|silence_duration: [0-9.]*" | paste - - | head -20 >> $out
          echo "-- gaps (async by timestamps):" >> $out
          ffmpeg -hide_banner -nostdin -i /tmp/all.ts -vn -af aresample=async=1000,silencedetect=n=-50dB:d=0.02 -f null - 2>&1 | grep -o "silence_start: [0-9.]*\|silence_duration: [0-9.]*" | paste - - | head -20 >> $out
          echo "-- decode warnings:" >> $out
          ffmpeg -hide_banner -nostdin -loglevel warning -i /tmp/all.ts -vn -f null - 2>&1 | sort | uniq -c | head -8 >> $out
          echo '```' >> $out
          sed -i "s/$K/***/g" $out
          gh issue comment 3 -R "$GITHUB_REPOSITORY" -F $out
# Fri Oct  9 09:17:37 IDT 2026
