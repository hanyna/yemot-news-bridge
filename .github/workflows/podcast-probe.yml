name: Podcast probe (temporary)
on:
  workflow_dispatch: {}
  push:
    paths: [".github/workflows/podcast-probe.yml"]
permissions:
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: |
          set +e
          out=/tmp/probe.md
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "# בדיקת הקדמות — $(date -u)" > $out
          echo '```' >> $out
          K=$(printf %s "$YEMOT_API_KEY" | tr -d '[:space:]')
          for e in 2 2/1 2/2 3 3/1 3/3 3/4 8; do
            curl -s -m 30 -H "Authorization: $K" --data-urlencode "path=ivr2:/$e" https://www.call2all.co.il/ym/api/GetIVR2Dir > /tmp/d.json
            echo "-- $e: $(python3 -c "import json;d=json.load(open('/tmp/d.json'));print(' '.join(f['name'] for f in (d.get('files') or []) if f['name'].startswith(('99999','M1000'))))")" >> $out
            curl -s -m 30 -H "Authorization: $K" --data-urlencode "what=ivr2:/$e/M1000-spoken.txt" https://www.call2all.co.il/ym/api/GetTextFile | python3 -c "import json,sys;c=json.load(sys.stdin).get('contents','');print('   ',c[:200]) if c else None" >> $out 2>&1
          done
          echo '```' >> $out
          sed -i "s/$K/***/g" $out
          gh issue comment 3 -R "$GITHUB_REPOSITORY" -F $out
