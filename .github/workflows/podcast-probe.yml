name: Podcast probe (temporary)
on:
  workflow_dispatch: {}
  push:
    paths: [".github/workflows/podcast-probe.yml"]
permissions:
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: |
          set +e
          out=/tmp/probe.md
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "# איכות ההקלטה מערוץ 14 — $(date -u)" > $out
          echo '```' >> $out
          K=x
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1
          B=https://r.il.cdn-redge.media/livehls/oil/ch14/live/ch14/live.livx
          curl -sL -m 20 -A "$UA" "$B/playlist.m3u8" | head -30 >> $out
          echo "-- variant:" >> $out
          V=$(curl -sL -m 20 -A "$UA" "$B/playlist.m3u8" | grep -v '^#' | grep . | head -1)
          echo "$V" >> $out
          u=$(date -u -d "2026-10-08T18:40:00Z" +%s)
          rm -f /tmp/all.ts
          for i in $(seq 0 14); do ms=$(( ((u-978307200)/4*4 + i*4)*1000 )); curl -sL -m 20 -A "$UA" "$B/fragment.ts?audioId=1&startTime=$ms" >> /tmp/all.ts; done
          ffprobe -hide_banner /tmp/all.ts 2>&1 | grep -i "stream\|duration" >> $out
          for a in 0 2 3; do ms=$(( ((u-978307200)/4*4)*1000 )); r=$(curl -sL -m 20 -A "$UA" -o /tmp/a$a.ts -w "%{http_code} %{size_download}" "$B/fragment.ts?audioId=$a&startTime=$ms"); echo "audioId=$a → $r $(ffprobe -hide_banner /tmp/a$a.ts 2>&1 | grep -i stream | tr '\n' ' ')" >> $out; done
          ms=$(( ((u-978307200)/4*4)*1000 )); r=$(curl -sL -m 20 -A "$UA" -o /tmp/nv.ts -w "%{http_code} %{size_download}" "$B/fragment.ts?startTime=$ms"); echo "no audioId → $r $(ffprobe -hide_banner /tmp/nv.ts 2>&1 | grep -i stream | tr '\n' ' ')" >> $out
          ffmpeg -hide_banner -nostdin -i /tmp/all.ts -vn -af "volumedetect,astats=metadata=0:reset=0" -f null - 2>&1 | grep -i "mean_volume\|max_volume\|discontinu\|non monotonic\|error" | head -8 >> $out
          ffmpeg -hide_banner -nostdin -i /tmp/all.ts -vn -af silencedetect=n=-45dB:d=0.05 -f null - 2>&1 | grep -c silence_start | sed 's/^/short gaps: /' >> $out
          echo '```' >> $out
          sed -i "s/$K/***/g" $out
          gh issue comment 3 -R "$GITHUB_REPOSITORY" -F $out
# Fri Oct  9 09:17:37 IDT 2026
