name: probe-yt
on:
  push:
    branches: [probe-yt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: |
          set +e
          exec > probe-out.txt 2>&1
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for u in "https://tv.c14.co.il/" "https://tv.c14.co.il/serie/63cd2cf4ca5a380012e20fe0" "https://vod.c14.co.il/serie/63cd2cf4ca5a380012e20fe0" "https://tv.c14.co.il/player/channel/63a2edcb4343c600125cdbb6"; do
            echo "== GET $u"
            curl -sS -L -m 30 -A "$UA" -o page.html -w "status=%{http_code} final=%{url_effective} size=%{size_download}\n" "$u"
            grep -o '<script[^>]*src="[^"]*"' page.html | head -20
            grep -oE 'https?://[a-zA-Z0-9./_-]*(api|graphql|redge|redgalaxy|player|cdn)[a-zA-Z0-9./_-]*' page.html | sort -u | head -40
            grep -oE '<link[^>]*(manifest|preconnect|dns-prefetch)[^>]*>' page.html | head
            echo "-- inline json keys:"; grep -oE '"(apiUrl|API_URL|apiBase|baseUrl|tenant|platform)[^,]{0,120}' page.html | head
          done
          echo "== JS bundles"
          for j in $(grep -o '<script[^>]*src="[^"]*"' page.html | grep -o 'src="[^"]*"' | cut -d'"' -f2 | head -8); do
            case "$j" in /*) j="https://tv.c14.co.il$j";; esac
            echo "-- $j"
            curl -sS -m 30 -A "$UA" "$j" | grep -oE 'https?://[a-zA-Z0-9./_-]*(api|redge|redgalaxy|galaxy)[a-zA-Z0-9./_-]*' | sort -u | head -30
            curl -sS -m 30 -A "$UA" "$j" | grep -oE '"/?(api|items|series|episodes|vods?|products|playlist|playback)[a-zA-Z0-9/_{}-]*"' | sort -u | head -40
          done
          echo "== yt-dlp other clients"
          pip install -q -U yt-dlp
          sudo apt-get install -y -qq deno >/dev/null 2>&1 || (curl -fsSL https://deno.land/install.sh | sh >/dev/null 2>&1; export PATH="$HOME/.deno/bin:$PATH")
          export PATH="$HOME/.deno/bin:$PATH"
          for c in "--extractor-args youtube:player_client=mweb" "--extractor-args youtube:player_client=web_embedded" "--extractor-args youtube:player_client=tv_embedded" "--extractor-args youtube:player_client=web_safari"; do
            echo "--- try: $c"; rm -f /tmp/a.*
            if timeout 240 yt-dlp -f "bestaudio[abr<=64]/bestaudio/best" $c --no-playlist -o "/tmp/a.%(ext)s" "https://www.youtube.com/watch?v=99Yq0j12NXg" 2>&1 | tail -3; then ls -la /tmp/a.* 2>/dev/null && echo "OK with: $c" && break; fi
          done
          exit 0
      - run: |
          git config user.name probe && git config user.email probe@none
          git add probe-out.txt && git commit -qm "probe output [skip ci]" && git push
