name: probe-yt
on:
  push:
    branches: [probe-yt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: |
          set +e
          exec > probe-out.txt 2>&1
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "== itunes search"
          for t in "%D7%94%D7%A4%D7%98%D7%A8%D7%99%D7%95%D7%98%D7%99%D7%9D" "%D7%94%D7%A4%D7%98%D7%A8%D7%99%D7%95%D7%98%D7%99%D7%9D%2014" "patriots%2014"; do
            curl -sS -m 30 "https://itunes.apple.com/search?term=$t&media=podcast&country=il&limit=15" | jq -r '.results[] | [.collectionName,.artistName,.feedUrl,.trackCount,.releaseDate] | @tsv'
          done
          echo "== spotify page"
          curl -sS -L -m 30 -A "$UA" "https://open.spotify.com/show/4qkG28SrHynd859I9Ot0eP" -o sp.html -w "status=%{http_code}\n"
          grep -oE '(anchor\.fm|creators\.spotify\.com|omny|rss|feed)[^"<> ]{0,120}' sp.html | sort -u | head -20
          grep -oE '<title>[^<]*' sp.html
          echo "== feeds"
          for f in $(cat feeds.txt 2>/dev/null); do :; done
          curl -sS -m 30 "https://itunes.apple.com/search?term=%D7%94%D7%A4%D7%98%D7%A8%D7%99%D7%95%D7%98%D7%99%D7%9D&media=podcast&country=il&limit=15" | jq -r '.results[].feedUrl' | sort -u > feeds.txt
          for f in $(cat feeds.txt); do
            echo "--- $f"
            curl -sS -L -m 30 -A "$UA" "$f" -o feed.xml -w "status=%{http_code} size=%{size_download}\n"
            python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          try:
              r = ET.parse('feed.xml').getroot()
              ch = r.find('channel')
              print('TITLE', ch.findtext('title'))
              ns = {'itunes': 'http://www.itunes.com/dtds/podcast-1.0.dtd'}
              for it in ch.findall('item')[:8]:
                  enc = it.find('enclosure')
                  print(' |', it.findtext('pubDate'), '|', it.findtext('itunes:duration', namespaces=ns), '|', (it.findtext('title') or '')[:90], '|', enc.get('url')[:120] if enc is not None else None)
          except Exception as e:
              print('ERR', e)
          EOF
          done
          exit 0
      - run: |
          git config user.name probe && git config user.email probe@none
          git add probe-out.txt && git commit -qm "probe output [skip ci]" && git push
