name: Voice check (temporary)
on: workflow_dispatch
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - name: Check voice files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_DIAG: "1"
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: |
          set +e
          { echo "# בדיקת קול — $(date -u)"; echo '```'
          for R in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/bridge.yml/runs?per_page=6" --jq '.workflow_runs[].id'); do
            J=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$R/jobs" --jq '.jobs[0].id')
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$J/logs" > log.txt 2>/dev/null
            echo "== הפעלה $R: $(wc -l < log.txt) שורות"
            grep -o 'קול מוכן: .*' log.txt | sed -E 's/.*\((gemini[^,)]*)[^)]*\).*/\1/' | sort | uniq -c
            grep -o 'קול מוכן: .*' log.txt | tail -4 | cut -c1-200
            grep -E 'הערה: (הקול|יצירת קול)' log.txt | tail -4 | cut -c1-260
          done
          go test -count=1 -run TestVoiceDiag -v . 2>&1 | grep -v "^=== RUN\|^--- \|^PASS\|^ok "
          echo '```'; } > report.md
          num=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=50" --jq '.[] | select(.title=="בדיקת קול (זמני)") | .number' | head -1)
          if [ -z "$num" ]; then num=$(gh api "repos/$GITHUB_REPOSITORY/issues" -f title="בדיקת קול (זמני)" -f body="תוצאות בדיקה זמנית" --jq .number); fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$num/comments" -F body=@report.md --jq .html_url
