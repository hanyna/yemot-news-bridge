name: Patriots SMS alert

# התראת SMS יומית דרך ימות המשיח כשתוכנית הפטריוטים לא עלתה (scripts/patriots_sms.py).
# שולח SMS רק אם משהו לא תקין: פרק נכשל בהחלפה, או שכלי הפטריוטים (ה-VM) לא רץ.
# אם הכול תקין — שקט. מספר היעד נשמר ב-Secret בשם SMS_TO (לא בקוד).
#
# השעה: 00:40 שעון ישראל — אחרי שריצת הלילה של ה-VM (23:40) מסתיימת (בערך 00:05)
# והגשר קורא את הסטטוס. GitHub עובד לפי UTC ואין לו שעון קיץ, לכן שתי שעות:
# 22:40 UTC (חורף) ו-21:40 UTC (קיץ), והצעד הראשון בוחר אחת מהן לפי שעון החורף/קיץ בישראל.
# חשוב: לא בודקים מה השעה בפועל — GitHub מאחר לפעמים בשעות (בנובמבר 2026 כל הריצות
# הגיעו באיחור של 4–5 שעות, נפלו מחוץ לחלון 00:30–01:30, ושום בדיקה לא רצה). בוחרים
# לפי איזה תזמון הפעיל את הריצה, כך שגם ריצה מאוחרת בודקת ושולחת.
on:
  schedule:
    - cron: "40 22 * * *"
    - cron: "40 21 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "שליחת SMS בדיקה מיד (1 = כן)"
        required: false
        default: "0"

permissions:
  issues: read

concurrency:
  group: patriots-sms

jobs:
  sms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only the cron that matches Israel winter/summer time
        id: when
        env:
          FIRED: ${{ github.event.schedule }}
        run: |
          want="40 22 * * *"                                   # חורף (UTC+2)
          [ "$(TZ=Asia/Jerusalem date +%z)" = "+0300" ] && want="40 21 * * *"   # קיץ (UTC+3)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$FIRED" = "$want" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "התזמון הזה ($FIRED) שייך לעונה השנייה — מדלג. (הפעיל: $want)"
          fi
      - uses: actions/checkout@v5
        if: steps.when.outputs.go == '1'
      - name: Check patriots and alert by SMS
        if: steps.when.outputs.go == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
          YEMOT_SMS_TOKEN: ${{ secrets.YEMOT_SMS_TOKEN }}   # אופציונלי: מספר-מערכת:סיסמה
          SMS_TO: ${{ secrets.SMS_TO }}                     # חובה: מספר היעד
          SMS_FROM: ${{ secrets.SMS_FROM }}                 # אופציונלי: שם/מספר שולח
          SMS_TEST: ${{ github.event.inputs.test }}
        run: python3 scripts/patriots_sms.py
