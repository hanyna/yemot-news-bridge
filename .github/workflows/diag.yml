name: Diag full
on:
  push:
    branches: [diag-full]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - name: Diag
        env:
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
          TGPOPUP_KEY: ${{ secrets.TGPOPUP_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: go test -tags diag -run TestDiagQuota -v -count=1 -timeout 13m .
