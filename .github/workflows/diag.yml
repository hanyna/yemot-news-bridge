name: Diag vision
on:
  push:
    branches: [diag-vision]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Diag
        env:
          TGPOPUP_KEY: ${{ secrets.TGPOPUP_KEY }}
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: go test -tags diag -run TestDiagDryRun -v -count=1 -timeout 12m .
