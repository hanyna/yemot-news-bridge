name: Diag voices
on:
  push:
    branches: [diag-voices]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Diag
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: go test -tags diag -run TestDiagVoices -v -count=1 -timeout 10m .
      - name: Save samples
        if: always()
        run: |
          ls samples || exit 0
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add samples && git commit -qm "voice samples" && git push
