name: Diag long
on:
  push:
    branches: [diag-long]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - env:
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: go test -tags diag -run TestDiagLong -v -count=1 .
