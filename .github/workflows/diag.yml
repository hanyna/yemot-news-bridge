name: Diag check
on:
  push:
    branches: [diag-check]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - name: Diag
        env:
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: go test -tags diag -run TestDiagLine -v -count=1 -timeout 8m .
