name: Telegram to Yemot bridge

on:
  schedule:
    - cron: "*/5 * * * *"   # כל 5 דקות (GitHub Actions לא מבטיח דיוק מושלם)
  workflow_dispatch: {}       # מאפשר גם הרצה ידנית מהטאב Actions, לבדיקות

jobs:
  run-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false   # אין תלויות חיצוניות (אין go.sum), אז אין מה לשמור במטמון

      - name: Run bridge
        env:
          TGPOPUP_KEY: ${{ secrets.TGPOPUP_KEY }}
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: go run .
