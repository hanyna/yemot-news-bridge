name: Telegram to Yemot bridge

# כל הפעלה נשארת פתוחה עד שעתיים ובודקת הודעות חדשות כל דקה.
# כל 30 דקות מופעלת הפעלה חדשה שמחליפה את הקודמת (cancel-in-progress),
# כך שיש תמיד הפעלה אחת פעילה — גם אם GitHub מאחר ריצה מתוזמנת.
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]      # עדכון קוד נכנס לתוקף מיד
  workflow_dispatch: {}   # הפעלה ידנית מהטאב Actions

concurrency:
  group: yemot-bridge
  cancel-in-progress: true

jobs:
  run-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false   # אין תלויות חיצוניות (אין go.sum), אז אין מה לשמור במטמון

      - name: Build
        run: go build -o bridge .

      - name: Run bridge (loop)
        env:
          TGPOPUP_KEY: ${{ secrets.TGPOPUP_KEY }}
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}   # לבדיקה אם יש גרסה חדשה יותר (אז ההפעלה הישנה נעצרת)
          RUN_MINUTES: "120"       # כמה זמן ההפעלה נשארת פתוחה
          INTERVAL_SECONDS: "60"   # כל כמה שניות לבדוק הודעות חדשות
          YEMOT_MAX_MSGS: "10"     # כמה הודעות בשלוחה 1 (כל הערוצים)
          YEMOT_PER_CHANNEL: "5"   # כמה הודעות בשלוחה של כל ערוץ (2 ומעלה)
          YEMOT_ORDER: "oldest"    # oldest = 001 הישנה והמספר הגבוה החדשה. ימות המשיח משמיע מהגבוה לנמוך, כך שהחדשה נשמעת ראשונה
          CHANNEL_EXTS: "on"       # off = בלי שלוחה לכל ערוץ
          YEMOT_VOICE: ""          # קול: Jacob / Sivan / Osnat (ריק = לא לשנות)
          YEMOT_RATE: ""           # מהירות: מ -10 (איטי) עד 10 (מהיר), ריק = לא לשנות
        run: ./bridge
