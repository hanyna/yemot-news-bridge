name: Telegram to Yemot bridge

# כל הפעלה נשארת פתוחה עד 5.5 שעות ובודקת הודעות חדשות כל 20 שניות.
# בסוף, ההפעלה מפעילה בעצמה את הבאה (שרשרת) — לא תלויים בשעון של GitHub,
# שלפעמים מדלג על ריצות מתוזמנות (זה מה שעצר את הקו בלילה).
# הריצה המתוזמנת כל 30 דקות היא רק גיבוי: היא נכנסת לתור ולא מפסיקה ריצה פעילה.
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]      # עדכון קוד נכנס לתוקף מיד
  workflow_dispatch: {}   # הפעלה ידנית מהטאב Actions

# הרשאות מינימליות: הגשר רק קורא את הקוד (לא כותב למאגר).
permissions:
  contents: read
  actions: write   # כדי שההפעלה תוכל להפעיל את הבאה בשרשרת

concurrency:
  group: yemot-bridge
  cancel-in-progress: false   # ריצה חדשה מחכה בתור; קוד חדש — הישנה נעצרת לבד תוך 2 דקות

jobs:
  run-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false   # אין תלויות חיצוניות (אין go.sum), אז אין מה לשמור במטמון

      - name: Build
        run: go build -o bridge .

      # ffmpeg מחלץ את הקול מסרטונים והודעות קוליות. בלעדיו הגשר עובד, רק בלי הקול.
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) || echo "ffmpeg לא הותקן — ממשיך בלי קול"

      - name: Run bridge (loop)
        env:
          TGPOPUP_KEY: ${{ secrets.TGPOPUP_KEY }}
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # ניתוח תמונות (Google AI Studio). בלי המפתח — "פורסמה תמונה" כמו קודם
          # מפתחות נוספים לקול המוכן — כל אחד מפרויקט נפרד ב-Google AI Studio = עוד 40 הודעות ביום בחינם.
          # כשמפתח אחד מגיע למכסה, הגשר עובר לבא. כשכולם במכסה — ההודעות עולות כטקסט.
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GITHUB_TOKEN: ${{ github.token }}   # לבדיקה אם יש גרסה חדשה יותר (אז ההפעלה הישנה נעצרת)
          RUN_MINUTES: "330"       # כמה זמן ההפעלה נשארת פתוחה (GitHub מגביל ל-6 שעות)
          INTERVAL_SECONDS: "20"   # כל כמה שניות לבדוק הודעות חדשות (השרת של ערוץ חי עצמו סורק את טלגרם בערך פעם בדקה)
          # כל הודעה נשמרת בשלוחה 1 ובשלוחת הכתב שלה, כל עוד יש מקום (ימות מרשים עד 3,000 קבצים בשלוחה — ראו archive.go).
          CHANNEL_EXTS: "on"       # off = בלי שלוחה לכל ערוץ
          # ערוצים שלא נכנסים לקו (בערוץ חי הם נשארים), מופרדים בפסיק. מה שכבר עלה מהם — נמחק מהקו.
          EXCLUDE_CHANNELS: "SamariaUpdates"
          AUDIO: "on"              # הקול של סרטונים והודעות קוליות מושמע אחרי ההקראה. off = רק תיאור ("פורסם סרטון באורך...")
          SPEECH: "on"             # כל הודעה עולה גם כקובץ שמע מוכן (Gemini) — בלי המתנה וגמגום בהאזנה. off = רק טקסט
          SPEECH_VOICE: "Charon"   # קול ההודעות: Charon (גבר), Kore (אישה) ועוד — ראו voice.go
          SPEECH_MENU_VOICE: "Puck" # קול התפריט הראשי, התפריטים וכותרות הכתבים
          VISION: "on"             # תמונות: תיאור קצר + הטקסט שכתוב עליהן (Gemini). off = רק "פורסמה תמונה"
          AUDIO_MAX_MINUTES: "20"  # סרטון ארוך מזה — רק התיאור, בלי הקול
          # פודקאסטים בשלוחה 3 (תפריט → 3/1, 3/2...): שורה לכל פודקאסט — "השם בתפריט | קישור להזנה (RSS)".
          # כל פרק חדש נכנס לבד (נשמע ראשון). ריק = בלי שלוחת פודקאסטים.
          PODCASTS: |
            חושבים בקול של הקול היהודי | https://www.spreaker.com/show/4524009/episodes/feed
          PODCAST_KEEP: "10"       # כמה פרקים אחרונים נשמרים מכל פודקאסט (כשנכנס חדש — הישן ביותר יוצא)
          YEMOT_VOICE: "Elik_2100" # קול: Jacob (גבר) / Elik_2100 (גבר, ברירת מחדל) / Sivan / Osnat (נשים). ריק = לא לשנות
          YEMOT_RATE: "0"          # מהירות: מ -10 (איטי) עד 10 (מהיר), 0 = רגילה. ריק = לא לשנות
          PUBLIC_TZINTUK_LIST: "800"         # רשימת הצינתוקים הכללית — הרשמה/הסרה בשלוחה 8/1. ריק = בלי שלוחה 8
          YEMOT_LINE_NUMBER: "0772263731"    # מספר הקו — לאן טלזכור (8/2) מזכיר לחייג
          CALLBACK_ENABLED: "on"             # שלוחה 8/3: שיחה חוזרת מהמערכת (חוסכת דקות למתקשר). off = בלי שלוחה זו
          ADMIN_TZINTUK_LIST: "606"     # רשימת הצינתוקים של המנהל — צינתוק על כל הודעה חדשה בשלוחה 6
          ADMIN_TZINTUK_REGISTER: "off" # on = שלוחה 7 היא (זמנית, מוסתרת) הרשמה של בעל הקו לרשימה. בעל הקו נרשם — כבוי
        run: ./bridge

      # שרשרת: מפעילים את ההפעלה הבאה — גם אם זו נכשלה (ניסיון חוזר).
      # לא מפעילים אם ההפעלה נעצרה כי יש גרסה חדשה (היא כבר רצה) או בוטלה ידנית.
      - name: Start next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .no-chain ]; then
            echo "יש גרסה חדשה שכבר רצה — לא מפעיל שרשרת."
            exit 0
          fi
          if [ "${{ job.status }}" = "failure" ]; then
            echo "ההפעלה נכשלה — מחכה 2 דקות לפני ניסיון חוזר."
            sleep 120
          fi
          gh workflow run bridge.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "ההפעלה הבאה הופעלה."
