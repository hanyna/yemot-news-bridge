name: X check (temporary)
on: workflow_dispatch
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - name: Check accounts now
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIAG: "1"
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: |
          set +e
          UA="yemot-news-bridge (phone news line; https://github.com/hanyna/yemot-news-bridge)"
          { echo "# בדיקת החשבונות — $(date -u)"; echo '```'
          for H in ariel__danino meiretingr; do
            curl -s -A "$UA" --max-time 25 "https://api.fxtwitter.com/$H" -o p.json
            echo "== $H פרופיל: $(grep -o '"tweets":[0-9]*' p.json) $(grep -o '"name":"[^"]*"' p.json | head -1)"
          done
          go test -count=1 -run TestLineDiag -v . 2>&1 | grep -v "^=== RUN\|^--- \|^PASS\|^ok " | sed -n '/### שלוחה 2/,$p'
          echo '```'; } > report.md
          num=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=50" --jq '.[] | select(.title=="בדיקת טוויטר") | .number' | head -1)
          gh api "repos/$GITHUB_REPOSITORY/issues/$num/comments" -F body=@report.md --jq .html_url
