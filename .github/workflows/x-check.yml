name: X check (temporary)
on: workflow_dispatch
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - name: Line diagnosis
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIAG: "1"
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: |
          set +e
          go test -count=1 -run TestLineDiag -v . > out.txt 2>&1
          { echo "# אבחון הקו — $(date -u)"; echo '```'; grep -v "^=== RUN\|^--- \|^PASS\|^ok " out.txt | tail -c 9000; echo '```'; } > report.md
          num=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=50" --jq '.[] | select(.title=="בדיקת טוויטר") | .number' | head -1)
          gh api "repos/$GITHUB_REPOSITORY/issues/$num/comments" -F body=@report.md --jq .html_url
