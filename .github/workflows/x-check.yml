name: X check (temporary)
on: workflow_dispatch
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - name: Hosts over time
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "# שתי כתובות לאורך זמן — $(date -u)" > report.md; echo '```' >> report.md
          for r in $(seq 1 8); do
            line="$r $(date -u +%H:%M):"
            for B in api.fxtwitter.com api.fixupx.com; do
              for H in ariel__danino meiretingr; do
                code=$(curl -s -o b -w '%{http_code}' --max-time 25 -A "yemot-news-bridge (phone news line; https://github.com/hanyna/yemot-news-bridge)" "https://$B/2/profile/$H/statuses")
                line="$line $B/$H=$code/$(grep -o '"created_at"' b | wc -l)"
              done
            done
            echo "$line" >> report.md
            [ $r -lt 8 ] && sleep 45
          done
          echo '```' >> report.md
          num=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=50" --jq '.[] | select(.title=="בדיקת טוויטר") | .number' | head -1)
          gh api "repos/$GITHUB_REPOSITORY/issues/$num/comments" -F body=@report.md --jq .html_url
