name: X check (temporary)
on: workflow_dispatch
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - name: Check accounts now
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIAG: "1"
          YEMOT_API_KEY: ${{ secrets.YEMOT_API_KEY }}
        run: |
          set +e
          UA="yemot-news-bridge (phone news line; https://github.com/hanyna/yemot-news-bridge)"
          { echo "# בדיקת החשבונות — $(date -u)"; echo '```'
          for P in statuses replies media likes; do
            code=$(curl -s -A "$UA" --max-time 25 -o b.json -w '%{http_code}' "https://api.fxtwitter.com/2/profile/ariel__danino/$P")
            echo "== $P: $code, $(grep -o '"created_at"' b.json | wc -l) ציוצים"
            grep -o '"created_at":"[^"]*"' b.json | head -4
          done
          echo '```'; } > report.md
          num=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=50" --jq '.[] | select(.title=="בדיקת טוויטר") | .number' | head -1)
          gh api "repos/$GITHUB_REPOSITORY/issues/$num/comments" -F body=@report.md --jq .html_url
