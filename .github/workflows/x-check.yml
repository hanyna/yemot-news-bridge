name: X check (temporary)
on: workflow_dispatch
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - name: Live test (real code)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          X_LIVE: "ariel__danino,meiretingr"
          X_WHY: "meiretingr"
        run: |
          set +e
          go test -count=1 -run "TestXLive|TestXLiveWhy" -v . > out.txt 2>&1
          rc=$?
          { echo "# בדיקה חיה של הקוד האמיתי — $(date -u) — תוצאה: $rc"; echo '```'; tail -c 6000 out.txt; echo '```'; } > report.md
          num=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=50" --jq '.[] | select(.title=="בדיקת טוויטר") | .number' | head -1)
          gh api "repos/$GITHUB_REPOSITORY/issues/$num/comments" -F body=@report.md --jq .html_url
